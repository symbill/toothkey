# Keep this machine from offering itself to phones as a call-audio device.
#
# Written for toothkey, which pairs this computer to an iPhone as a
# Bluetooth HID keyboard. With a bond in place and WirePlumber
# registering the HSP/HFP roles, BlueZ's policy plugin auto-connects
# audio profiles whenever the link comes up — and the phone's call
# audio moves to the computer. Observed 2026-10-08: a live call went
# silent as the box attached as a Hands-Free unit.
#
# Dropping the headset roles removes the Handsfree (0x111e) and
# Handsfree Audio Gateway (0x111f) SDP records, so a phone can no
# longer see this machine as a route for call audio at all. It also
# clears the Telephony bit from the adapter's Class of Device, which
# toothkey wants anyway: it needs the adapter to read as a keyboard.
#
# A2DP and LE Audio are deliberately kept, so Bluetooth headphones and
# speakers still work and the phone can still stream music here. Calls
# are the only thing given up.
#
# bluez5.roles        - our own roles; hsp_hs / hfp_hf are the headset
#                       ("unit") side, i.e. this box acting as someone's
#                       earpiece. That is the role the journal caught.
# bluez5.headset-roles - the gateway side (hsp_ag / hfp_ag), i.e. this
#                       box offering to be a phone. Empty disables it.
#
# Note bluez5.enable-hfp / bluez5.enable-hsp do NOT exist in this
# build of libspa-bluez5 and are silently ignored; these two keys are
# the ones it actually reads.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
  bluez5.headset-roles = [ ]
}
